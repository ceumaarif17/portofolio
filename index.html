 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Portofolio Saya</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  text-align: center;
  background: #f4f4f4;
}

header {
  background: #2c3e50;
  color: white;
  padding: 25px;
}

section {
  padding: 20px;
  background: white;
  margin: 15px;
  border-radius: 10px;
}

img {
  width: 200px;
  border-radius: 10px;
  margin: 10px;
}

button {
  padding: 10px 20px;
  background: #3498db;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #2980b9;
}

footer {
  margin-top: 20px;
  padding: 10px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>Portofolio Saya</h1>
  <p>HTML • CSS • JavaScript</p>
</header>

<section>
  <h2>Tentang Saya</h2>
  <p>Ini adalah portofolio sederhana untuk demo project sekolah.</p>
</section>

<section>
  <h2>Galeri Gambar</h2>
  <!-- Ganti src dengan nama file gambarmu -->
  <img src="foto1.jpg" alt="gambar 1">
  <img src="foto2.jpg" alt="gambar 2">
</section>

<section>
  <h2>Demo JavaScript</h2>
  <button onclick="klikSaya()">Klik Saya</button>
  <p id="hasil"></p>
</section>

<footer>
  <p>© 2025 Portofolio Saya</p>
</footer>

<script>
function klikSaya() {
  document.getElementById("hasil").innerText =
    "JavaScript BERHASIL dijalankan!";
}
</script>

</body>
</html>
